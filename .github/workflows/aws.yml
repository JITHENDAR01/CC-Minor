name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: campusconnect
  ECS_SERVICE: campusconnect-service
  ECS_CLUSTER: campusconnect-cluster
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: campusconnect-service

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Configure ECS task definition
      id: configure-task-def
      env:
        ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
        ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
        DATABASE_URL_SECRET_ARN: ${{ vars.DATABASE_URL_SECRET_ARN }}
        SECRET_KEY_SECRET_ARN: ${{ vars.SECRET_KEY_SECRET_ARN }}
        S3_BUCKET: ${{ vars.S3_BUCKET }}
        S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL }}
      run: |
        set -euo pipefail
        : "${ECS_EXECUTION_ROLE_ARN:?Set ECS_EXECUTION_ROLE_ARN as a production environment variable}"
        : "${ECS_TASK_ROLE_ARN:?Set ECS_TASK_ROLE_ARN as a production environment variable}"
        : "${DATABASE_URL_SECRET_ARN:?Set DATABASE_URL_SECRET_ARN as a production environment variable}"
        : "${SECRET_KEY_SECRET_ARN:?Set SECRET_KEY_SECRET_ARN as a production environment variable}"
        : "${S3_BUCKET:?Set S3_BUCKET in GitHub Variables}"

        S3_PUBLIC_URL="${S3_PUBLIC_URL:-https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com}"
        if ! jq -e --arg container_name "$CONTAINER_NAME" \
          '.containerDefinitions | any(.name == $container_name)' \
          "$ECS_TASK_DEFINITION" > /dev/null; then
          echo "Container '$CONTAINER_NAME' not found in $ECS_TASK_DEFINITION" >&2
          exit 1
        fi
        jq \
          --arg execution_role "$ECS_EXECUTION_ROLE_ARN" \
          --arg task_role "$ECS_TASK_ROLE_ARN" \
          --arg database_url_secret "$DATABASE_URL_SECRET_ARN" \
          --arg secret_key_secret "$SECRET_KEY_SECRET_ARN" \
          --arg s3_bucket "$S3_BUCKET" \
          --arg s3_public_url "$S3_PUBLIC_URL" \
          --arg container_name "$CONTAINER_NAME" \
          '.executionRoleArn = $execution_role
           | .taskRoleArn = $task_role
           | .containerDefinitions |= map(
               if .name == $container_name then
                 .secrets = [
                   {name: "DATABASE_URL", valueFrom: $database_url_secret},
                   {name: "SECRET_KEY", valueFrom: $secret_key_secret}
                 ]
                 | .environment += [
                     {name: "S3_BUCKET", value: $s3_bucket},
                     {name: "S3_PUBLIC_URL", value: $s3_public_url}
                   ]
               else . end
             )' \
          "$ECS_TASK_DEFINITION" > "$RUNNER_TEMP/task-definition.json"
        echo "task-definition=$RUNNER_TEMP/task-definition.json" >> "$GITHUB_OUTPUT"

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.configure-task-def.outputs.task-definition }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
